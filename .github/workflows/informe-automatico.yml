name: Generar y enviar informe PDF

on:
  push:
    branches: [main]
    paths:
      - "datos/*.xlsx"
      - "datos/*.XLSX"
      - "datos/**/*.xlsx"
      - "datos/**/*.XLSX"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: informe-pdf-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generar-y-enviar:
    runs-on: ubuntu-latest
    env:
      TZ: America/Santiago
    steps:
      - name: Descargar repositorio actualizado
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Preparar generador de PDF
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Abrir dashboard y generar informe
        id: informe
        shell: bash
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > /tmp/dashboard-http.log 2>&1 &
          python scripts/generar_informe.py
          archivo=$(find informes -maxdepth 1 -type f -name '*.pdf' -printf '%p\n' | sort | tail -n 1)
          if [[ -z "$archivo" ]]; then
            echo "No se generó el informe PDF."
            exit 1
          fi
          echo "archivo=$archivo" >> "$GITHUB_OUTPUT"

      - name: Guardar PDF en el repositorio
        env:
          PDF_FILE: ${{ steps.informe.outputs.archivo }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PDF_FILE"
          git commit -m "Guardar informe PDF automático [skip ci]"
          git push

      - name: Enviar PDF por correo
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DESTINATARIOS_INFORME: ${{ secrets.DESTINATARIOS_INFORME }}
          PDF_FILES: ${{ steps.informe.outputs.archivo }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          UPDATED_BY: ${{ github.actor }}
          UPDATE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/enviar_pdf.py

      - name: Conservar copia descargable en GitHub Actions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-mantenimiento-${{ github.run_number }}
          path: ${{ steps.informe.outputs.archivo }}
          if-no-files-found: warn
          retention-days: 90
